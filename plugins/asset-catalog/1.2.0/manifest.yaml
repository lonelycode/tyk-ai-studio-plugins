# Identity & Versioning
id: "com.tyk.enterprise.asset-catalog"
name: "Asset Catalog (Enterprise)"
version: "1.2.0"
description: "An internal governance record of the AI assets your organisation builds and uses: agents, prompts, skills, guardrails, business applications and integrations, with ownership, versions, lifecycle and an audit trail. Map each asset's dependencies on other assets and on AI Studio's LLMs, tools, data sources, MCP servers, routers and Apps; rate the risk of the whole dependency graph; freeze it at approval; export it as CycloneDX. Assets stay internal until a publisher offers them in the AI Portal, to everyone or to chosen teams, with an access-request workflow and events for downstream automation."

