# Identity & Versioning
id: "com.tyk.enterprise.asset-catalog"
name: "Asset Catalog (Enterprise)"
version: "1.0.0"
description: "Register, own, version, relate and govern AI assets the gateway does not proxy: agents, prompts, skills, guardrails and external AI services. Adds them to the AI Portal with ownership, lineage, lifecycle tags, relationships, community submissions and an access-request workflow that raises events for downstream automation."

# OCI Distribution
oci:
  registry: "docker.tyk.io"
  repository: "studio-plugins/asset-catalog"
  tag: "1.0.0"
  digest: "sha256:72a7cc091f61044e53da294775bebaaa60328d74234d7c34b6359a1eae00cdd8"
  platform: ["linux/amd64", "darwin/arm64"]

# Discovery & Classification
category: "ui-extensions"
keywords: ["asset-catalog", "governance", "agents", "prompts", "skills", "guardrails", "portal", "ownership", "lineage", "access-requests", "enterprise"]
maturity: "beta"

# Documentation & Support
links:
  documentation: "https://github.com/TykTechnologies/tyk-ai-studio-plugins-ce/tree/main/plugins/asset-catalog"
  repository: "https://github.com/TykTechnologies/ai-studio-community-plugins"
  support: "https://community.tyk.io"
  issues: "https://github.com/TykTechnologies/ai-studio-community-plugins/issues"
  homepage: "https://tyk.io/ai-studio"

# Display Assets
icon: "https://raw.githubusercontent.com/TykTechnologies/tyk-ai-studio-plugins-ce/main/plugins/asset-catalog/1.0.0/icon.svg"
screenshots: []

# Maintainers
maintainers:
  - name: "Tyk Technologies"
    email: "support@tyk.io"
    organization: "Tyk Technologies"

publisher: "tyk-official"
license: "Commercial"

# Capabilities
capabilities:
  hooks: ["resource_provider", "studio_ui", "portal_ui"]
  primary_hook: "resource_provider"

# Requirements & Compatibility
requirements:
  min_studio_version: "2.2.0"
  api_versions: ["ui-v1", "rpc-v1", "kv-v1"]
  dependencies: []

# Security & Permissions
permissions:
  services: ["kv.readwrite", "license.read", "notifications.write", "resource-types.manage", "metadata.read", "metadata.write"]
  kv: ["read", "write"]
  rpc: ["call"]
  ui: ["sidebar.register", "route.register"]

# Configuration Schema
config_schema_url: ""

# Verification
attestation:
  enabled: false
  sigstore_bundle_url: ""

# Enterprise
enterprise_only: true

